<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tes Upload</title></head>
<body style="font:13px monospace;white-space:pre-wrap;background:#111;color:#9f9;padding:14px" id="out">mulai...
<script>
const CONFIG = { url: 'https://mzaxwsxpsfjhwailsrwz.supabase.co', anonKey: 'sb_publishable_WqQuEVBC8BAPP5BBMjeCNQ_77TB-PAn' };
const log = (...a) => { document.getElementById('out').textContent += '\n' + a.join(' '); };
window.onerror = (m,s,l) => log('JS-ERROR:', m, 'baris', l);

let session = null;
function uploadXHR(bucket, path, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', CONFIG.url + '/storage/v1/object/' + bucket + '/' + path);
    xhr.setRequestHeader('apikey', CONFIG.anonKey);
    if (session?.access_token) xhr.setRequestHeader('Authorization', 'Bearer ' + session.access_token);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText || '{}'));
      else { let m = 'Upload gagal (' + xhr.status + ')'; try { m = JSON.parse(xhr.responseText).message || m; } catch (e) {} reject(new Error(m)); }
    };
    xhr.onerror = () => reject(new Error('Koneksi terputus saat upload. Periksa jaringan.'));
    xhr.send(file);
  });
}

async function main() {
  // 1. login
  const lr = await fetch(CONFIG.url + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: { 'apikey': CONFIG.anonKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: 'e2e2-tes@dharmalabs.id', password: 'DharmaE2E2026!' })
  });
  log('login:', lr.status);
  session = await lr.json();
  const uid = session.user?.id;
  log('uid:', uid);

  // 2. blob uji bertingkat
  for (const size of [102400, 3*1024*1024, 10*1024*1024]) {
    const bytes = new Uint8Array(size);
    for (let i = 0; i < size; i += 4096) bytes[i] = 65;
    const file = new File([bytes], 'uji.wav', { type: 'audio/wav' });
    const t0 = Date.now();
    try {
      const r = await uploadXHR('dharma-audio', uid + '/' + size + '.wav', file,
        p => { if (p % 50 === 0) log('progress', size, p + '%'); });
      log('UPLOAD', size, 'OK dalam', ((Date.now()-t0)/1000).toFixed(1) + 's', JSON.stringify(r).slice(0, 60));
    } catch (e) {
      log('UPLOAD', size, 'GAGAL:', e.message, '(' + ((Date.now()-t0)/1000).toFixed(1) + 's)');
    }
  }
  log('SELESAI TES');
}
main().catch(e => log('FATAL:', e.message));
</script></body></html>
